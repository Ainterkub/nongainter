<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nongainter ♡ My Little Shop</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #f8f5ff;
      --purple-light: #efe8ff;
      --purple-accent: #a88beb;
      --purple-dark: #62547d;
      --text-muted: #9386ab;
      --card-bg: rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(180deg, #f8f5ff 0%, #ede6fc 100%);
      color: var(--purple-dark);
      min-height: 100vh;
      padding-bottom: 115px;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .floating-deco { display: inline-block; animation: floatSlow 3.2s ease-in-out infinite; }

    .container { width: 100%; max-width: 440px; padding: 18px 16px; }

    /* ส่วนหัวด้านบน */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 27px;
      font-weight: 600;
      color: var(--purple-dark);
    }

    .top-actions { display: flex; align-items: center; gap: 8px; }

    .status-badge {
      background: #fff;
      border: 1px solid #e4dafc;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(168, 139, 235, 0.15);
    }

    .dot {
      width: 7px; height: 7px;
      background-color: #6bc48d;
      border-radius: 50%;
      animation: pulseSoft 1.8s infinite;
    }

    .dot.closed { background-color: #e57373; }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid #e4dafc;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      color: var(--purple-dark);
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(168, 139, 235, 0.15);
      transition: transform 0.2s;
    }

    .icon-btn:active { transform: scale(0.92); }

    /* การ์ดต้อนรับหลัก */
    .hero-card {
      background: var(--card-bg);
      border: 1.5px solid #fff;
      border-radius: 26px;
      padding: 24px 20px;
      box-shadow: 0 12px 28px rgba(145, 118, 207, 0.14);
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
      animation: slideUp 0.45s ease;
    }

    .hero-card::after {
      content: "୨୧";
      position: absolute;
      top: 12px; right: 18px;
      font-size: 54px;
      color: rgba(168, 139, 235, 0.22);
      animation: floatSlow 4s ease-in-out infinite;
      pointer-events: none;
    }

    .welcome-sub { font-size: 10px; letter-spacing: 2.5px; color: var(--text-muted); margin-bottom: 6px; }
    .hero-title { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 600; line-height: 1.1; margin-bottom: 8px; }
    .open-hours { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: var(--text-muted); margin-bottom: 14px; }
    .hero-desc { font-size: 12.5px; line-height: 1.75; font-weight: 300; margin-bottom: 18px; }
    .hero-footer { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--purple-accent); }
    .pill-tag { background: #fff; border: 1px solid #e4dafc; padding: 4px 14px; border-radius: 20px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; }

    /* การ์ด 3 ช่อง */
    .grid-3 { display: grid; grid-template-columns: 1fr 1.05fr 1fr; gap: 10px; margin-bottom: 16px; }
    .mini-card {
      background: var(--card-bg); border: 1.5px solid #fff; border-radius: 20px;
      padding: 10px 8px; text-align: center; box-shadow: 0 6px 18px rgba(145, 118, 207, 0.12);
    }
    .mini-img-box {
      width: 100%; height: 100px; border-radius: 14px;
      background: linear-gradient(135deg, #f3ecff, #e6dcfa);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px; font-size: 28px; color: var(--purple-accent);
    }
    .mini-caption { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12.5px; color: var(--text-muted); }
    .center-quote { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .quote-text { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; line-height: 1.25; }

    /* ระบบเปลี่ยนหน้า */
    .section-page { display: none; }
    .section-page.active { display: block; animation: slideUp 0.35s ease; }

    .list-card {
      background: var(--card-bg); border-radius: 22px; padding: 18px;
      margin-bottom: 12px; border: 1.5px solid #fff;
      box-shadow: 0 8px 20px rgba(145, 118, 207, 0.12);
    }
    .list-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .list-sub { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }
    .price-tag { background: var(--purple-light); padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }

    /* ฟอร์มทั่วไป */
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 12px; margin-bottom: 10px;
      border: 1px solid #dfd3fa; border-radius: 14px;
      font-family: 'Prompt', sans-serif; font-size: 12.5px;
      background: #fcfaff; color: var(--purple-dark); outline: none;
    }
    .form-label { font-size: 11.5px; color: var(--text-muted); margin-bottom: 4px; display: block; }

    .submit-btn {
      width: 100%; background: linear-gradient(120deg, #b69cf2, #9b7de3);
      color: #fff; border: none; padding: 11px; border-radius: 14px;
      font-family: 'Prompt', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; box-shadow: 0 4px 12px rgba(155, 125, 227, 0.3);
    }

    .del-btn {
      background: #ffe5e5; color: #c94a4a; border: none;
      padding: 3px 8px; border-radius: 8px; font-size: 11px; cursor: pointer;
    }

    /* รีวิว */
    .review-item {
      background: #fff; border-radius: 16px; padding: 12px 14px;
      margin-bottom: 10px; border: 1px solid #ede6fc;
    }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 12.5px; font-weight: 500; }
    .stars { color: #f5b942; font-size: 12px; }
    .review-text { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

    .contact-btn {
      display: block; width: 100%; text-align: center;
      background: var(--purple-light); color: var(--purple-dark);
      text-decoration: none; padding: 11px; border-radius: 14px;
      font-size: 13px; margin-top: 10px; font-weight: 500;
    }

    /* หน้าต่างหลังบ้าน (Modal) */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(65, 50, 95, 0.45); backdrop-filter: blur(4px);
      z-index: 200; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; width: 100%; max-width: 410px; max-height: 85vh;
      overflow-y: auto; border-radius: 24px; padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #f0eaff; padding-bottom: 10px; }
    .admin-section { background: #faf8ff; border: 1px solid #ece4fc; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .admin-section h4 { font-size: 13.5px; margin-bottom: 10px; color: var(--purple-dark); }

    /* แถบเมนูด้านล่าง */
    .bottom-nav-wrapper {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 408px; z-index: 100;
    }
    .portfolio-tag {
      background: rgba(255, 255, 255, 0.92); border: 1px solid #e4dafc; border-bottom: none;
      display: inline-block; padding: 3px 12px; border-radius: 12px 12px 0 0;
      font-size: 9px; letter-spacing: 1.5px; color: var(--text-muted); margin-left: 16px;
    }
    .bottom-nav {
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
      border: 1px solid #fff; border-radius: 22px; padding: 8px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      box-shadow: 0 8px 25px rgba(130, 105, 190, 0.2);
    }
    .nav-item {
      border: none; background: transparent; border-radius: 16px; padding: 8px 4px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text-muted); font-family: 'Prompt', sans-serif; font-size: 11px; cursor: pointer;
    }
    .nav-item.active { background: var(--purple-light); color: var(--purple-dark); font-weight: 500; }
    .nav-icon { font-size: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- ส่วนหัว -->
    <header class="top-bar">
      <div class="brand-name"><span id="displayBrandTop">nongainter</span> <span class="floating-deco">♡</span></div>
      <div class="top-actions">
        <div class="status-badge">
